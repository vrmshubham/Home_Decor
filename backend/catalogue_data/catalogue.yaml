# Home Decor catalogue — single source of truth for categories, products, prices,
# stock and photos.
#
# How to use:
#   1. Edit this file to add, change or remove categories and products.
#   2. Put photos for a product in:
#        backend/media/products/<category-slug>/<product-slug>/
#      Any .jpg/.jpeg/.png/.webp file dropped there is linked automatically, in
#      filename order (e.g. 01-front.jpg, 02-detail.jpg, ...).
#   3. From the backend/ folder, run:
#        python manage.py sync_catalogue
#
# Removing a category or product block below HIDES it from the storefront (it is
# marked inactive, not deleted, so nothing is lost by mistake). To permanently
# delete products that are no longer listed here, run:
#        python manage.py sync_catalogue --prune
# Add --dry-run to either command to preview changes without touching the database.
#
# Only the fields shown below are required for a basic listing. You can add any
# other field that exists on the Product model (pricing, fabric, care instructions,
# SEO text, etc.) — see backend/apps/catalogue/models.py for the full list.

